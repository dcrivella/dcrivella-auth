name: Auth Server CI

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version used by Auth Server CI
        required: true
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests (No Docker)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run Auth unit tests (No Docker)
        run: ./gradlew :auth-server:test --no-daemon

      - name: Publish Auth unit test results (No Docker)
        uses: dorny/test-reporter@v3.0.0
        if: ${{ !cancelled() && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        with:
          name: Auth Unit Tests (No Docker)
          path: auth-server/build/test-results/test/*.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          fail-on-error: true
          fail-on-empty: false
          use-actions-summary: true

      - name: Upload failed Auth unit reports (No Docker)
        uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: auth-unit-test-reports
          path: |
            auth-server/build/test-results/test/*.xml
            auth-server/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

  integration-tests:
    name: Integration Tests (In-Process Spring Boot, No Docker)
    needs: unit-tests
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run Auth integration tests (In-Process Spring Boot, No Docker)
        run: ./gradlew :auth-server:integrationTest --no-daemon

      - name: Publish Auth integration test results (In-Process Spring Boot, No Docker)
        uses: dorny/test-reporter@v3.0.0
        if: ${{ !cancelled() && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
        with:
          name: Auth Integration Tests (In-Process Spring Boot, No Docker)
          path: auth-server/build/test-results/integrationTest/*.xml
          reporter: java-junit
          list-suites: all
          list-tests: all
          fail-on-error: true
          fail-on-empty: true
          use-actions-summary: true

      - name: Upload failed Auth integration reports (In-Process Spring Boot, No Docker)
        uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: auth-integration-test-reports
          path: |
            auth-server/build/test-results/integrationTest/*.xml
            auth-server/build/reports/tests/integrationTest/
          if-no-files-found: ignore
          retention-days: 7
