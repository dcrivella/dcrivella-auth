# Keep configuration-cache incompatibilities visible instead of silently degrading builds.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# Kotlin's embedded IntelliJ platform defaults this registry value to 1000.
# Pinning the same value keeps it stable across Gradle daemons and cache keys.
systemProp.platform.random.idempotence.check.rate=1000
